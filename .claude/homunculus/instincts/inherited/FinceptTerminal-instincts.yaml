# FinceptTerminal Workflow Add New Analytics Or Strategy Engine

## Action

Follow the add-new-analytics-or-strategy-engine workflow:
1. Create or update files in finscope/analytics/ (for analytics) or finscope/engines/ (for strategies/engines).
2. Register the new engine or strategy in the appropriate registry or __init__.py.
3. Update or create tests to verify the new analytics or strategy logic.
4. If relevant, update UI commands or agent interfaces to expose the new functionality.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: finscope/analytics/*.py, finscope/engines/*.py, finscope/engines/strategies*.py

