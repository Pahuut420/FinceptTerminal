# FinceptTerminal Workflow Add New Data Provider

## Action

Follow the add-new-data-provider workflow:
1. Create a new provider implementation in finscope/core/providers/ (e.g., yfinance_provider.py).
2. Register the provider with the DataHub or provider registry.
3. Optionally, add demo data or update public_apis.json if relevant.
4. Add or update tests in finscope/tests/test_providers.py.
5. Update UI command handlers if new commands are exposed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: finscope/core/providers/*.py, finscope/core/datahub.py, finscope/core/providers/public_apis_registry.py

