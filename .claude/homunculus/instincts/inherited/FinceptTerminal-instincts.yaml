# FinceptTerminal Workflow Add New Data Provider

## Action

Follow the add-new-data-provider workflow:
1. Create a new provider implementation in finscope/core/providers/ (e.g., yfinance_provider.py, stooq_provider.py, cryptocom_provider.py, polymarket_provider.py).
2. Register the provider so it is discoverable by the DataHub or provider registry.
3. Optionally add demo data or update provider registry files if needed.
4. Update or create tests in finscope/tests/ if relevant.
5. Update UI commands or function extensions if the provider exposes new commands.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: finscope/core/providers/*.py, finscope/core/providers/__init__.py, finscope/core/providers/public_apis_registry.py

