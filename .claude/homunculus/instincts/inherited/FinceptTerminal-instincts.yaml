# FinceptTerminal Workflow Add New Analytics Or Strategy Engine

## Action

Follow the add-new-analytics-or-strategy-engine workflow:
1. Create a new strategy or analytics module in finscope/engines/ (e.g., strategies_alpha.py, strategies_alpha2.py) or finscope/analytics/.
2. Register the strategy/engine in the engine registry or main engine file.
3. Update or add tests to verify analytics/strategy correctness.
4. Expose new strategy via agent/dashboard surface if relevant.
5. Document the new strategy in research/program.md or related docs.

## Evidence

- Workflow detected from commit patterns
